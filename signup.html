<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก | HUD-DID</title><link rel="stylesheet" href="assets/css/app.css?v=4"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js.example"></script><script defer src="assets/js/app.js"></script></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">♪</span> HUD-DID</a><a href="login.html" class="muted">เข้าสู่ระบบ</a></nav><main class="card form-card"><span class="eyebrow">START LEARNING</span><h2 style="font-size:2rem;letter-spacing:-.05em;margin:12px 0">สร้างบัญชีผู้เรียน</h2><p class="muted">สมัครเพื่อบันทึกบทเรียนและติดตามพัฒนาการ</p><div id="message" class="notice hidden" role="status"></div><form id="signup-form"><div class="field"><label for="name">ชื่อที่แสดง</label><input id="name" required maxlength="60" autocomplete="name"></div><div class="field"><label for="email">อีเมล</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><div class="password-wrap"><input id="password" type="password" required minlength="6" autocomplete="new-password" lang="en" autocapitalize="off" spellcheck="false"><button class="password-toggle" type="button" data-toggle-password="password">แสดง</button></div><small class="field-help">ตรวจสอบแป้นพิมพ์ให้เป็น ENG ก่อนพิมพ์รหัสผ่าน</small><small id="password-language-warning" class="field-help password-warning hidden">ตรวจพบอักษรไทยในรหัสผ่าน โปรดเปลี่ยนแป้นพิมพ์เป็น ENG</small></div><div class="field"><label for="confirm-password">ยืนยันรหัสผ่าน</label><div class="password-wrap"><input id="confirm-password" type="password" required minlength="6" autocomplete="new-password" lang="en" autocapitalize="off" spellcheck="false"><button class="password-toggle" type="button" data-toggle-password="confirm-password">แสดง</button></div></div><button class="btn" type="submit" style="width:100%">สมัครสมาชิก</button></form><p class="muted" style="margin-top:20px;font-size:.9rem">มีบัญชีแล้ว? <a href="login.html" style="color:var(--green);font-weight:700">เข้าสู่ระบบ</a></p><p class="muted" style="font-size:.8rem" id="backend-status"></p></main></div></body></html>
