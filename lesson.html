<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บทเรียน | HUD-DID</title><link rel="stylesheet" href="assets/css/app.css?v=3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js.example"></script><script defer src="assets/js/app.js"></script></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">♪</span> HUD-DID</a><div class="nav-links"><a href="courses.html">หลักสูตรทั้งหมด</a><a class="btn" href="dashboard.html">ห้องเรียนของฉัน</a></div></nav><main><header class="page-head"><span class="eyebrow">LESSON</span><h1 id="title">กำลังโหลดบทเรียน…</h1><p class="lead" id="summary"></p></header><article class="card" style="max-width:850px;line-height:1.9"><div class="tag" id="level"></div><div id="content" style="white-space:pre-wrap;margin-top:18px"></div><div style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap"><button id="complete" class="btn">ทำเครื่องหมายว่าเรียนจบแล้ว ✓</button><a href="courses.html" class="btn light">กลับไปยังหลักสูตร</a></div><div id="message" class="notice hidden" style="margin-top:18px"></div></article></main><footer class="footer">HUD-DID · Practice a little every day</footer></div><script>
document.addEventListener('DOMContentLoaded',async()=>{
 const params=new URLSearchParams(location.search),slug=params.get('slug');
 const title=document.querySelector('#title'),summary=document.querySelector('#summary'),content=document.querySelector('#content'),level=document.querySelector('#level'),message=document.querySelector('#message'),button=document.querySelector('#complete');
 if(!slug){title.textContent='ไม่พบบทเรียน';return;}
 if(!window.HudDid?.configured){title.textContent='ยังไม่ได้เชื่อมต่อฐานข้อมูล';summary.textContent='กรุณาตั้งค่า Supabase ตามคู่มือ README-SETUP.md ก่อนเปิดบทเรียน';button.disabled=true;return;}
 try{const lessons=await HudDid.getLessons(),lesson=lessons.find(x=>x.slug===slug);if(!lesson){title.textContent='ไม่พบบทเรียนนี้';return;}
 title.textContent=lesson.title;summary.textContent=lesson.summary;level.textContent=lesson.level;content.textContent=lesson.content;
 button.addEventListener('click',async()=>{try{await HudDid.saveProgress(lesson.id,true);message.textContent='บันทึกความคืบหน้าเรียบร้อยแล้ว';message.classList.remove('hidden','error');}catch(e){message.textContent=e.message;message.classList.remove('hidden');message.classList.add('error');}});
 }catch(e){title.textContent='เกิดข้อผิดพลาด';message.textContent=e.message;message.classList.remove('hidden');}
});
</script></body></html>
