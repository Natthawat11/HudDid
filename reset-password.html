<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งรหัสผ่านใหม่ | HUD-DID</title><link rel="stylesheet" href="assets/css/app.css?v=4"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js.example"></script><script defer src="assets/js/app.js"></script></head>
<body><div class="wrap"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">♪</span> HUD-DID</a><a href="login.html" class="muted">กลับเข้าสู่ระบบ</a></nav>
<main class="card form-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1 style="font-size:2rem">ตั้งรหัสผ่านใหม่</h1><p class="muted">กรอกอีเมลเพื่อรับลิงก์ หรือเปิดหน้านี้จากลิงก์ในอีเมลเพื่อกำหนดรหัสผ่านใหม่</p>
<div id="message" class="notice hidden" role="status"></div>
<form id="reset-request-form"><div class="field"><label for="email">อีเมลบัญชีของคุณ</label><input id="email" type="email" required autocomplete="email"></div><button class="btn" type="submit" style="width:100%">ส่งลิงก์ตั้งรหัสผ่านใหม่</button></form>
<div style="margin:24px 0;border-top:1px solid var(--line)"></div>
<form id="reset-password-form"><div class="field"><label for="new-password">รหัสผ่านใหม่</label><div class="password-wrap"><input id="new-password" type="password" minlength="6" required autocomplete="new-password" lang="en" autocapitalize="off" spellcheck="false"><button class="password-toggle" type="button" data-toggle-password="new-password">แสดง</button></div></div><div class="field"><label for="confirm-new-password">ยืนยันรหัสผ่านใหม่</label><div class="password-wrap"><input id="confirm-new-password" type="password" minlength="6" required autocomplete="new-password" lang="en" autocapitalize="off" spellcheck="false"><button class="password-toggle" type="button" data-toggle-password="confirm-new-password">แสดง</button></div></div><small id="new-password-language-warning" class="field-help password-warning hidden">ตรวจพบอักษรไทยในรหัสผ่าน โปรดเปลี่ยนแป้นพิมพ์เป็น ENG</small><button class="btn" type="submit" style="width:100%">บันทึกรหัสผ่านใหม่</button></form>
</main></div></body></html>
