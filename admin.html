<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการบทเรียน | HUD-DID</title><link rel="stylesheet" href="assets/css/app.css?v=3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js.example"></script><script defer src="assets/js/app.js"></script></head>
<body><div class="wrap">
<nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">♪</span> HUD-DID <span class="tag">ADMIN</span></a><div class="nav-links"><a href="dashboard.html">ห้องเรียน</a><button id="logout" class="btn light" type="button">ออกจากระบบ</button></div></nav>
<main id="admin-page">
<header class="page-head"><span class="eyebrow">COURSE MANAGEMENT</span><h1>จัดการหลักสูตร</h1><p class="lead">เพิ่ม แก้ไข และลบบทเรียนในระบบได้จากที่นี่</p></header>
<div id="message" class="notice hidden" role="status"></div>
<section class="section" style="padding-top:10px"><div class="section-head"><div><span class="eyebrow">LESSON EDITOR</span><h2>เพิ่มหรือแก้ไขบทเรียน</h2></div></div>
<form id="admin-form" class="card">
<input id="lesson-id" type="hidden">
<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
<div class="field"><label for="lesson-title">ชื่อบทเรียน</label><input id="lesson-title" required maxlength="140"></div>
<div class="field"><label for="lesson-slug">Slug (ภาษาอังกฤษ)</label><input id="lesson-slug" required pattern="[a-z0-9-]+" maxlength="140"></div>
<div class="field"><label for="lesson-level">ระดับ</label><select id="lesson-level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option><option value="professional">Professional</option></select></div>
<div class="field"><label for="lesson-order">ลำดับการแสดง</label><input id="lesson-order" type="number" value="0"></div>
</div>
<div class="field"><label for="lesson-summary">คำอธิบายสั้น</label><input id="lesson-summary" required maxlength="240"></div>
<div class="field"><label for="lesson-content">เนื้อหาบทเรียน</label><textarea id="lesson-content" rows="12" required placeholder="เขียนเนื้อหา เป้าหมาย ขั้นตอนฝึก และแบบฝึกหัด"></textarea></div>
<label style="display:flex;align-items:center;gap:10px;margin:14px 0 20px"><input id="lesson-published" type="checkbox" checked> เผยแพร่ให้ผู้เรียนเห็น</label>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button id="admin-submit" class="btn" type="submit">เพิ่มบทเรียน</button><button class="btn light" type="reset" onclick="document.querySelector('#lesson-id').value='';document.querySelector('#admin-submit').textContent='เพิ่มบทเรียน'">ล้างฟอร์ม</button></div>
</form></section>
<section class="section"><div class="section-head"><div><span class="eyebrow">ALL LESSONS</span><h2>บทเรียนในระบบ</h2></div></div><div id="admin-list" class="lesson-list"><div class="notice">กำลังโหลดบทเรียน…</div></div></section>
</main><footer class="footer">HUD-DID · Admin workspace</footer></div></body></html>
