<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการบทเรียน | HUD-DID</title><link rel="stylesheet" href="assets/css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js.example"></script><script defer src="assets/js/app.js"></script></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">♪</span> HUD-DID ADMIN</a><button id="logout" class="btn light">ออกจากระบบ</button></nav><main id="admin-page"><header class="page-head"><span class="eyebrow">ADMINISTRATION</span><h1>จัดการหลักสูตร</h1><p class="lead">เพิ่มบทเรียนใหม่และจัดลำดับเนื้อหาสำหรับผู้เรียน</p></header><div id="message" class="notice hidden"></div><form id="admin-form" class="card"><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="lesson-title">ชื่อบทเรียน</label><input id="lesson-title" required></div><div class="field"><label for="lesson-slug">Slug (ภาษาอังกฤษ)</label><input id="lesson-slug" required pattern="[a-z0-9-]+"></div><div class="field"><label for="lesson-level">ระดับ</label><select id="lesson-level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option><option value="professional">Professional</option></select></div><div class="field"><label for="lesson-order">ลำดับ</label><input id="lesson-order" type="number" value="0"></div></div><div class="field"><label for="lesson-summary">คำอธิบายสั้น</label><input id="lesson-summary" required></div><div class="field"><label for="lesson-content">เนื้อหาบทเรียน</label><textarea id="lesson-content" rows="7" style="width:100%;padding:14px;border:1px solid #dce3db;border-radius:12px" required></textarea></div><button class="btn" type="submit">เพิ่มบทเรียน</button></form></main></div></body></html>
